#This file is used to package the ExportPackingList plugin.
#
#- It was generated by the InvenTree Plugin Creator tool - version 1.13.4
#- Ref: https://github.com/inventree/plugin_creator

[build-system]
requires = ["setuptools", "twine", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inventree-export-packing-list"
description = "Plugin designed to add additional exported data for InvenTree BOs"
dynamic = ["version"]
authors = [
    { name = "Hannah Hepburn",email = "hannahm.hepburn@gmail.com" },
]
readme = "README.md"
license = "MIT"
keywords = ["inventree", "plugin"]
requires-python = ">=3.9"
dependencies = [
    "djangorestframework",
    "tablib",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Framework :: InvenTree",
]

[project.entry-points."inventree_plugins"]
export-packing-list = "export_packing_list.ExportPackingList:ExportPackingList"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "export_packing_list.PLUGIN_VERSION"}

[tool.ruff]
exclude = [
    ".git",
    "__pycache__",
    "test.py",
    "tests",
    "venv",
    "env",
    ".venv",
    ".env",
]